<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="40" x2="1280" y2="40"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- Left accent line -->
  <rect x="0" y="0" width="3" height="320" fill="url(#accent)"/>

  <!-- Icon box -->
  <rect x="60" y="110" width="80" height="80" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <!-- SQL icon: database cylinder -->
  <ellipse cx="100" cy="128" rx="22" ry="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <rect x="78" y="128" width="44" height="28" fill="#0f172a"/>
  <ellipse cx="100" cy="156" rx="22" ry="8" fill="#f59e0b" opacity="0.3"/>
  <line x1="78" y1="138" x2="78" y2="156" stroke="#f59e0b" stroke-width="2"/>
  <line x1="122" y1="138" x2="122" y2="156" stroke="#f59e0b" stroke-width="2"/>
  <!-- Arrow from NL to SQL -->
  <text x="92" y="148" font-size="9" fill="#3b82f6" font-family="monospace" text-anchor="middle">NL→SQL</text>

  <!-- Brand name -->
  <text x="165" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#f1f5f9">SQL</text>
  <text x="265" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#f59e0b">-GPT</text>

  <!-- Tagline -->
  <text x="165" y="188" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#94a3b8">Natural language → SQL agent · Self-healing execution · What-If simulation</text>

  <!-- Pipeline flow visual on the right -->
  <g transform="translate(860, 80)">
    <!-- Node boxes -->
    <rect x="0" y="0" width="90" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="45" y="21" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">Plain English</text>

    <line x1="45" y1="32" x2="45" y2="52" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="40,50 45,58 50,50" fill="#3b82f6"/>

    <rect x="0" y="58" width="90" height="32" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="79" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">LangChain</text>

    <line x1="45" y1="90" x2="45" y2="110" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="40,108 45,116 50,108" fill="#8b5cf6"/>

    <rect x="0" y="116" width="90" height="32" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="45" y="137" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">DuckDB SQL</text>

    <line x1="45" y1="148" x2="45" y2="168" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="40,166 45,174 50,166" fill="#10b981"/>

    <rect x="0" y="174" width="90" height="32" rx="6" fill="#0d2818" stroke="#10b981" stroke-width="1.5"/>
    <text x="45" y="195" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">Results + Chart</text>
  </g>

  <!-- Stats badges -->
  <g transform="translate(165, 220)">
    <!-- Badge 1: Accuracy -->
    <rect x="0" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="8" y="14" font-family="monospace" font-size="10" fill="#64748b">ACCURACY</text>
    <text x="8" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f59e0b">91.7% on 60-Q</text>

    <!-- Badge 2: Retrieval -->
    <rect x="145" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="153" y="14" font-family="monospace" font-size="10" fill="#64748b">RETRIEVAL</text>
    <text x="153" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">ChromaDB + RAG</text>

    <!-- Badge 3: Safety -->
    <rect x="290" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="298" y="14" font-family="monospace" font-size="10" fill="#64748b">SAFETY REFUSAL</text>
    <text x="298" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#10b981">100% SQL guard</text>

    <!-- Badge 4: LLM -->
    <rect x="435" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="443" y="14" font-family="monospace" font-size="10" fill="#64748b">LLM ENGINE</text>
    <text x="443" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Claude / GPT-4o</text>
  </g>
</svg>
